<style>
/* Layout: a phone-shaped player beside a list of the ten concepts; stacks on phones. Tokens follow beribus.com. */
:root {
  --bg: #F5F5F2; --panel: #FFFFFF; --fg: #10151F; --muted: #4A5162; --line: #DCDCD6; --accent: #16304F; --warm: #B4532A; --stage: #0E1B2D; --sel: #E8EDF3;
  --font: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #0D121B; --panel: #151C28; --fg: #E9EDF3; --muted: #A3ACBC; --line: #263044; --accent: #9DB7D8; --warm: #E08A62; --stage: #070C14; --sel: #1E2A3D; color-scheme: dark; }
}
:root[data-theme="dark"] { --bg: #0D121B; --panel: #151C28; --fg: #E9EDF3; --muted: #A3ACBC; --line: #263044; --accent: #9DB7D8; --warm: #E08A62; --stage: #070C14; --sel: #1E2A3D; color-scheme: dark; }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 15px; }
.wrap { max-width: 1120px; margin: 0 auto; padding-inline: 20px; padding-block: 24px 40px; display: grid; gap: 20px; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: start; }
@media (max-width: 860px) { .wrap { grid-template-columns: minmax(0, 1fr); padding-inline: 16px; } }
header { grid-column: 1 / -1; display: flex; flex-direction: column; gap: 6px; }
h1 { font-weight: 800; font-size: clamp(22px, 3vw, 30px); margin: 0; letter-spacing: -0.02em; color: var(--accent); }
header p { margin: 0; color: var(--muted); max-width: 70ch; }
.stage { background: var(--stage); border-radius: 10px; padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; position: sticky; top: env(safe-area-inset-top, 0px); }
.screen { display: grid; place-items: center; }
canvas { display: block; max-width: 100%; height: min(72vh, 740px); width: auto; aspect-ratio: 9 / 16; border-radius: 12px; box-shadow: 0 14px 34px rgba(0,0,0,.4); }
.transport { display: flex; align-items: center; gap: 12px; color: #D3DAE5; }
.transport button { flex: none; width: 38px; height: 38px; border-radius: 50%; border: 1px solid #33425A; background: #18263B; color: #F1F4F8; font-size: 15px; cursor: pointer; display: grid; place-items: center; }
.transport input[type=range] { flex: 1; min-width: 0; accent-color: #E08A62; }
.time { font-variant-numeric: tabular-nums; font-size: 13px; min-width: 9ch; text-align: right; }
ol.list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.list button { width: 100%; text-align: left; display: grid; grid-template-columns: 2.4em minmax(0, 1fr) auto; gap: 4px 10px; align-items: baseline; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; color: var(--fg); font: inherit; cursor: pointer; }
.list button[aria-current="true"] { background: var(--sel); border-color: var(--accent); }
.list button:focus-visible, .transport button:focus-visible { outline: 2px solid var(--warm); outline-offset: 2px; }
.num { font-weight: 800; color: var(--warm); font-variant-numeric: tabular-nums; }
.name { font-weight: 700; min-width: 0; }
.dur { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.hook { grid-column: 2 / -1; font-size: 13px; color: var(--muted); line-height: 1.4; min-width: 0; }
</style>

    <h1>Beribus TikTok Series</h1>
    <p>Ten vertical ads for one offer: a website for €100 for the first 10 clients. Each has its own hook, its own kind of motion and the same Beribus ending. Pick one on the right to play it.</p>

  </section>
  <ol class="list" id="list"></ol>
</div>

// ---------- frame ----------
let cur = 0, t = 0;
function render(time) {
  const v = VIDEOS[cur]; t = time;
  ctx.save(); ctx.clearRect(0, 0, W, H); v.fn(time); ctx.restore();
  const out = prog(time, v.dur - 0.25, 0.25); if (out > 0) { ctx.fillStyle = `rgba(245,245,242,${eInOut(out)})`; ctx.fillRect(0, 0, W, H); }
  ctx.fillStyle = "rgba(127,127,127,0.25)"; ctx.fillRect(0, 0, W, 10); ctx.fillStyle = C.warm; ctx.fillRect(0, 0, W * clamp(time / (v.dur - 0.3)), 10);
}

// ---------- UI ----------
const list = document.getElementById("list");
VIDEOS.forEach((v, i) => {
  const li = document.createElement("li"), b = document.createElement("button"); b.type = "button";
  b.innerHTML = `<span class="num">${String(v.id).padStart(2, "0")}</span><span class="name"></span><span class="dur">${v.dur} s</span><span class="hook"></span>`;
  b.querySelector(".name").textContent = v.name; b.querySelector(".hook").textContent = v.hook;
  b.addEventListener("click", () => { select(i); playing = true; });
  li.appendChild(b); list.appendChild(li);
});
let playing = !matchMedia("(prefers-reduced-motion: reduce)").matches, last = null;
const scrub = document.getElementById("scrub"), timeEl = document.getElementById("time"), playBtn = document.getElementById("play");
function select(i) { cur = i; t = 0; list.querySelectorAll("button").forEach((b, k) => b.setAttribute("aria-current", k === i)); scrub.max = Math.round(VIDEOS[i].dur * 1000); }
function loop(now) {
  const d = VIDEOS[cur].dur;
  if (playing) { if (last != null) t = (t + (now - last) / 1000) % d; last = now; } else last = null;
  render(t); scrub.value = Math.round(t * 1000); timeEl.textContent = t.toFixed(1) + " / " + d + " s";
  playBtn.textContent = playing ? "❚❚" : "▶"; playBtn.setAttribute("aria-label", playing ? "Pause" : "Play");
  requestAnimationFrame(loop);
}
playBtn.addEventListener("click", () => { playing = !playing; });
scrub.addEventListener("input", () => { playing = false; t = scrub.value / 1000; });
select(0); if (!playing) t = 3;

window.promo = { VIDEOS, canvas: cv, ready: async () => { if (mark.decode) await mark.decode(); buildWhite(); }, pick(i) { select(i); playing = false; }, frame(time) { render(time); } };
document.fonts.load(font(900, 40)).catch(() => {});
requestAnimationFrame(loop);
})();
</script>
