<!doctype html><html><head><meta charset="utf-8"><style>__FONTS__ body{margin:0;background:#000}</style></head><body>
<canvas id="cv" width="1080" height="1920"></canvas>
<script>
// 2D motion graphics for the Beribus ads. Every frame is the average of several sub-frames (real motion blur).
const W = 1080, H = 1920;
const cv = document.getElementById("cv"), out = cv.getContext("2d");
const sub = document.createElement("canvas"); sub.width = W; sub.height = H;
let ctx = sub.getContext("2d");
const C = { navy: "#16304F", navy2: "#2C5079", deep: "#0B1626", warm: "#B4532A", warm2: "#E07A4F", peach: "#F0C3AD", cream: "#FFF8F0", white: "#FFFFFF", ink: "#10151F", soft: "#5A6272", green: "#2F9E62", red: "#D04B42", gold: "#E8B04A", mist: "#E8EDF3" };
const F = '"Inter", system-ui, sans-serif';
const IMG = {};
function load(name, url) { return new Promise(r => { const i = new Image(); i.onload = () => { IMG[name] = i; r(); }; i.onerror = () => r(); i.src = url; }); }

// ---------- easing / helpers ----------
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const prog = (t, s, d) => clamp((t - s) / d);
const lerp = (a, b, p) => a + (b - a) * p;
const E = {
  expo: p => p >= 1 ? 1 : 1 - Math.pow(2, -10 * p),
  io: p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2,
  inExpo: p => p <= 0 ? 0 : Math.pow(2, 10 * p - 10),
  quint: p => p < .5 ? 16 * p ** 5 : 1 - Math.pow(-2 * p + 2, 5) / 2,
  back: p => { const c1 = 1.4, c3 = c1 + 1; return 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2); },
};
const font = (w, s) => `${w} ${s}px ${F}`;
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function rng(seed) { return () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }; }
function txt(s, x, y, w, size, col, align = "center", track = -0.02) {
  ctx.font = font(w, size); ctx.fillStyle = col; ctx.textAlign = align; ctx.textBaseline = "alphabetic";
  if ("letterSpacing" in ctx) ctx.letterSpacing = (size * track) + "px";
  ctx.fillText(s, x, y);
  if ("letterSpacing" in ctx) ctx.letterSpacing = "0px";
}
function measure(s, w, size, track = -0.02) { ctx.font = font(w, size); if ("letterSpacing" in ctx) ctx.letterSpacing = (size * track) + "px"; const m = ctx.measureText(s).width; if ("letterSpacing" in ctx) ctx.letterSpacing = "0px"; return m; }
// masked line: slides up from behind its own baseline
function line(t, s, x, y, size, w, col, t0, o = {}) {
  const p = prog(t, t0, o.dur || 0.7); if (p <= 0) return;
  const outp = o.out != null ? E.inExpo(prog(t, o.out, 0.45)) : 0;
  const e = E.expo(p);
  ctx.save(); ctx.beginPath(); ctx.rect(-50, y - size * 1.0, W + 100, size * 1.3); ctx.clip();
  txt(s, x, y + (1 - e) * size * 1.1 - outp * size * 1.2, w, size, col, o.align || "center", o.track ?? -0.02);
  ctx.restore();
}
function shadow(blur, oy, a) { ctx.shadowColor = `rgba(5,10,20,${a})`; ctx.shadowBlur = blur; ctx.shadowOffsetY = oy; }
function noShadow() { ctx.shadowColor = "transparent"; ctx.shadowBlur = 0; ctx.shadowOffsetY = 0; }
function bgGrad(c1, c2) { const g = ctx.createLinearGradient(0, 0, W * 0.3, H); g.addColorStop(0, c1); g.addColorStop(1, c2); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); }
function vignette(a = 0.35) { const g = ctx.createRadialGradient(W / 2, H * 0.45, H * 0.25, W / 2, H * 0.5, H * 0.75); g.addColorStop(0, "rgba(0,0,0,0)"); g.addColorStop(1, `rgba(0,0,0,${a})`); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); }
function glow(x, y, r, col, a) { const g = ctx.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, col.replace("A", a)); g.addColorStop(1, col.replace("A", 0)); ctx.fillStyle = g; ctx.fillRect(x - r, y - r, r * 2, r * 2); }
function cover(img, zoom = 1, cx = 0.5, cy = 0.5, blur = 0) {
  if (!img) return; const s = Math.max(W / img.width, H / img.height) * zoom; const w = img.width * s, h = img.height * s;
  if (blur) ctx.filter = `blur(${blur}px)`; ctx.drawImage(img, W * cx - w * cx, H * cy - h * cy, w, h); ctx.filter = "none";
}
// diagonal brand bars sweeping across: the 3D -> 2D wipe
function bars(t, t0, cols, dur = 0.55, stagger = 0.07, dir = 1) {
  cols.forEach((c, i) => {
    const p = E.quint(prog(t, t0 + i * stagger, dur)); if (p <= 0) return;
    ctx.save(); ctx.translate(W / 2, H / 2); ctx.rotate(-0.32 * dir); ctx.fillStyle = c;
    const span = H * 1.6, x = lerp(-span, 0, p);
    ctx.fillRect(x - span / 2 + (dir < 0 ? span : 0) * 0, -H, span, H * 2); ctx.restore();
  });
}
function pill(s, x, y, size, bg, ink, o = {}) { const w = measure(s, 800, size) + size * 1.5, h = size * 1.95; shadow(30, 12, 0.25); ctx.fillStyle = bg; rr(x - w / 2, y - h / 2, w, h, h / 2); ctx.fill(); noShadow(); txt(s, x, y + size * 0.36, 800, size, ink); return w; }
function check(x, y, r, p, col = C.green) {
  ctx.fillStyle = col; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill(); if (p <= 0) return;
  ctx.strokeStyle = "#fff"; ctx.lineWidth = r * 0.24; ctx.lineCap = "round"; ctx.lineJoin = "round";
  const a = [x - r * 0.42, y + r * 0.02], b = [x - r * 0.1, y + r * 0.33], c = [x + r * 0.45, y - r * 0.3];
  ctx.beginPath(); ctx.moveTo(...a);
  if (p < 0.4) ctx.lineTo(lerp(a[0], b[0], p / 0.4), lerp(a[1], b[1], p / 0.4)); else { ctx.lineTo(...b); const q = (p - 0.4) / 0.6; ctx.lineTo(lerp(b[0], c[0], q), lerp(b[1], c[1], q)); }
  ctx.stroke();
}
function cross(x, y, r, p, col = C.red) { ctx.fillStyle = col; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill(); if (p <= 0) return; ctx.strokeStyle = "#fff"; ctx.lineWidth = r * 0.24; ctx.lineCap = "round"; const d = r * 0.36 * Math.min(1, p * 2); ctx.beginPath(); ctx.moveTo(x - d, y - d); ctx.lineTo(x + d, y + d); if (p > 0.5) { const q = (p - 0.5) * 2 * r * 0.72; ctx.moveTo(x + r * 0.36, y - r * 0.36); ctx.lineTo(x + r * 0.36 - q, y - r * 0.36 + q); } ctx.stroke(); }
function grain(t, a = 0.06) { const r = rng(Math.floor(t * 24) + 3); ctx.fillStyle = `rgba(255,255,255,${a})`; for (let i = 0; i < 900; i++) ctx.fillRect(r() * W, r() * H, 2, 2); ctx.fillStyle = `rgba(0,0,0,${a})`; for (let i = 0; i < 900; i++) ctx.fillRect(r() * W, r() * H, 2, 2); }
function logoRow(t, t0, y, ink = "#fff") { const p = E.expo(prog(t, t0, 0.7)); if (p <= 0) return; ctx.save(); ctx.globalAlpha = p; ctx.translate(0, (1 - p) * 30); const m = IMG.mark, h = 70, w = m ? h * m.width / m.height : 0; const tw = measure("beribus.com", 700, 52); const x0 = W / 2 - (w + 20 + tw) / 2; if (m) ctx.drawImage(ink === "#fff" ? IMG.markw || m : m, x0, y - h + 10, w, h); txt("beribus.com", x0 + w + 20, y, 700, 52, ink, "left"); ctx.restore(); }
function ctaCard(t, t0, word = "WEBSITE", verb = "Comment", dark = false) {
  const p = E.expo(prog(t, t0, 0.8)); if (p <= 0) return;
  const y = lerp(H + 100, H * 0.56, p);
  ctx.save(); shadow(70, 30, 0.35); ctx.fillStyle = dark ? C.deep : C.white; rr(80, y - 330, W - 160, 640, 48); ctx.fill(); noShadow();
  txt(verb, W / 2, y - 190, 700, 64, dark ? "rgba(255,255,255,0.75)" : C.soft);
  const pp = E.back(prog(t, t0 + 0.25, 0.6)); ctx.save(); ctx.translate(W / 2, y - 50); ctx.scale(0.7 + 0.3 * pp, 0.7 + 0.3 * pp); const pulse = 1 + 0.025 * Math.sin(Math.max(0, t - t0 - 1) * 6); ctx.scale(pulse, pulse); pill(`“${word}”`, 0, 0, 92, C.warm2, "#fff"); ctx.restore();
  txt("€100 website · first 10 clients", W / 2, y + 120, 600, 42, dark ? C.peach : C.warm);
  ctx.restore();
  logoRow(t, t0 + 0.4, y + 240, dark ? "#fff" : C.navy);
}

// =================== segments ===================
const SEG = {};
// 02 · 3D tower -> diagonal brand bars -> kinetic copy -> CTA
SEG[2] = { dur: 5.4, draw(t) {
  cover(IMG.bg, 1 + 0.03 * t);
  bars(t, 0.05, [C.peach, C.warm2, C.navy]);
  if (t > 0.6) {
    bgGrad(C.navy, C.deep); glow(W * 0.5, H * 0.35, 900, "rgba(224,122,79,A)", 0.25); vignette();
    const p = E.quint(prog(t, 0.05 + 0.14, 0.55)); // keep the last bar's edge sliding off
    const outK = E.inExpo(prog(t, 3.0, 0.5));
    ctx.save(); ctx.translate(0, -outK * 300); ctx.globalAlpha = 1 - outK;
    line(t, "No monthly fees.", W / 2, H * 0.36, 104, 900, "#fff", 0.65);
    line(t, "No hidden costs.", W / 2, H * 0.36 + 140, 104, 900, C.peach, 0.85);
    const jp = prog(t, 1.35, 0.7);
    if (jp > 0) { const e = E.expo(jp); const tw = measure("Just €100.", 900, 190); ctx.fillStyle = C.warm2; ctx.fillRect(W / 2 - tw / 2 - 30, H * 0.36 + 215, (tw + 60) * e, 235); line(t, "Just €100.", W / 2, H * 0.36 + 392, 190, 900, "#fff", 1.45); }
    ctx.restore();
    ctaCard(t, 3.2, "WEBSITE", "Comment");
  }
} };
// 03 · dive into the phone screen -> 2D site UI with badges -> CTA
SEG[3] = { dur: 5.6, draw(t) {
  const dive = E.io(prog(t, 0, 0.55));
  if (t < 0.6) { const S = window.SCREEN || { x: 0.5, y: 0.5, s: 4.5 }; cover(IMG.bg, 1 + (S.s - 1) * dive, S.x, S.y, dive * 14); }
  const ui = prog(t, 0.4, 0.3);
  if (ui > 0) {
    ctx.save(); ctx.globalAlpha = E.io(ui);
    const k = E.io(prog(t, 3.4, 0.9)); // UI shrinks into a phone card at the end
    const sc = lerp(1, 0.52, k), cy = lerp(H / 2, H * 0.36, k);
    bgGrad("#0E1B2D", C.deep); glow(W / 2, H * 0.3, 900, "rgba(44,80,121,A)", 0.7 * k);
    ctx.save(); ctx.translate(W / 2, cy); ctx.scale(sc, sc); ctx.translate(-W / 2, -H / 2);
    if (k > 0) { shadow(80, 40, 0.5 * k); ctx.fillStyle = "#111"; rr(-20, -20, W + 40, H + 40, 110 * k); ctx.fill(); noShadow(); ctx.save(); rr(0, 0, W, H, 90 * k); ctx.clip(); }
    const scroll = E.io(prog(t, 1.0, 2.0)) * 420;
    if (IMG.site) { const s = W / IMG.site.width; ctx.drawImage(IMG.site, 0, -scroll, W, IMG.site.height * s); }
    if (k > 0) ctx.restore();
    ctx.restore();
    // floating badges
    const badges = [["Live in 5 days", 1.1, 0.22, C.navy], ["Works on phones", 1.5, 0.42, C.green], ["€100 · first 10 clients", 1.9, 0.62, C.warm2]];
    badges.forEach(([s, t0, yy, col], i) => {
      const p = prog(t, t0, 0.6), o = E.inExpo(prog(t, 3.2, 0.4)); if (p <= 0 || o >= 1) return;
      const e = E.back(p); ctx.save(); ctx.globalAlpha = (1 - o); ctx.translate(i % 2 ? W * 0.62 : W * 0.38, H * yy - o * 60); ctx.scale(0.6 + 0.4 * e, 0.6 + 0.4 * e); ctx.rotate((i % 2 ? 1 : -1) * 0.04 * (1 - e)); pill(s, 0, 0, 56, col, "#fff"); ctx.restore();
    });
    ctx.restore();
    if (t > 3.6) { line(t, "Your site. Live in 5 days.", W / 2, H * 0.72, 70, 900, "#fff", 3.9); }
    if (t > 4.2) { const p = E.back(prog(t, 4.3, 0.6)); ctx.save(); ctx.translate(W / 2, H * 0.8); ctx.scale(0.7 + 0.3 * p, 0.7 + 0.3 * p); ctx.globalAlpha = clamp(p * 2); pill("DM “WEBSITE”", 0, 0, 70, C.warm2, "#fff"); ctx.restore(); logoRow(t, 4.6, H * 0.88); }
  }
} };
// 04 · the shards clear to an old, ugly website -> "Do what the cat did." -> slapped away -> new site -> CTA
function oldSite(w, h) {
  ctx.save(); shadow(60, 24, 0.5); ctx.fillStyle = "#D9D9D9"; rr(-w / 2, -h / 2, w, h, 18); ctx.fill(); noShadow();
  ctx.fillStyle = "#BDBDBD"; rr(-w / 2, -h / 2, w, 70, 18); ctx.fill(); ctx.fillRect(-w / 2, -h / 2 + 50, w, 20);
  ["#E06C5A", "#E8B04A", "#6CB26A"].forEach((c, i) => { ctx.fillStyle = c; ctx.beginPath(); ctx.arc(-w / 2 + 40 + i * 34, -h / 2 + 35, 11, 0, 7); ctx.fill(); });
  ctx.fillStyle = "#fff"; rr(-w / 2 + 150, -h / 2 + 15, w - 180, 40, 20); ctx.fill();
  ctx.font = "500 24px serif"; ctx.fillStyle = "#555"; ctx.textAlign = "left"; ctx.fillText("http://www.my-business-site.freehost.net/index.htm", -w / 2 + 170, -h / 2 + 43);
  ctx.beginPath(); ctx.rect(-w / 2, -h / 2 + 70, w, h - 70); ctx.clip();
  for (let y = -h / 2 + 70; y < h / 2; y += 40) for (let x = -w / 2; x < w / 2; x += 40) { ctx.fillStyle = ((x + y) / 40) % 2 ? "#F4F06A" : "#E9E25A"; ctx.fillRect(x, y, 40, 40); }
  ctx.textAlign = "center"; ctx.font = "bold 66px 'Comic Sans MS', 'Comic Neue', cursive"; ctx.fillStyle = "#E01EAF"; ctx.strokeStyle = "#1F2BD8"; ctx.lineWidth = 3;
  ctx.fillText("WELCOME TO MY", 0, -h / 2 + 170); ctx.strokeText("WELCOME TO MY", 0, -h / 2 + 170);
  ctx.fillText("WEBSITE!!!", 0, -h / 2 + 245); ctx.strokeText("WEBSITE!!!", 0, -h / 2 + 245);
  ctx.save(); ctx.translate(0, -h / 2 + 320); ctx.fillStyle = "#111"; ctx.fillRect(-w / 2, -32, w, 64); ctx.beginPath(); ctx.rect(-w / 2, -32, w, 64); ctx.clip();
  for (let x = -w / 2 - 60; x < w / 2; x += 60) { ctx.fillStyle = "#F2C400"; ctx.beginPath(); ctx.moveTo(x, 32); ctx.lineTo(x + 30, 32); ctx.lineTo(x + 60, -32); ctx.lineTo(x + 30, -32); ctx.fill(); }
  ctx.fillStyle = "#111"; ctx.fillRect(-250, -24, 500, 48); ctx.font = "bold 32px monospace"; ctx.fillStyle = "#F2C400"; ctx.fillText("UNDER CONSTRUCTION", 0, 11); ctx.restore();
  ctx.fillStyle = "#fff"; ctx.strokeStyle = "#888"; ctx.lineWidth = 3; ctx.fillRect(-w / 2 + 60, -h / 2 + 390, 300, 230); ctx.strokeRect(-w / 2 + 60, -h / 2 + 390, 300, 230);
  ctx.strokeStyle = "#D04B42"; ctx.lineWidth = 6; ctx.beginPath(); ctx.moveTo(-w / 2 + 180, -h / 2 + 470); ctx.lineTo(-w / 2 + 240, -h / 2 + 530); ctx.moveTo(-w / 2 + 240, -h / 2 + 470); ctx.lineTo(-w / 2 + 180, -h / 2 + 530); ctx.stroke();
  ctx.textAlign = "left"; ctx.font = "34px 'Times New Roman', serif"; ctx.fillStyle = "#1F2BD8";
  ["Home", "About Us", "Our Prices", "Guestbook", "Links!!"].forEach((s, i) => { const y = -h / 2 + 420 + i * 48; ctx.fillText(s, -w / 2 + 400, y); ctx.fillRect(-w / 2 + 400, y + 5, ctx.measureText(s).width, 2); });
  ctx.font = "28px 'Times New Roman', serif"; ctx.fillStyle = "#333"; ctx.textAlign = "center";
  ctx.fillText("Best viewed in Internet Explorer 6 at 800x600", 0, -h / 2 + 690);
  ctx.fillText("You are visitor number:", 0, -h / 2 + 760);
  ctx.fillStyle = "#000"; ctx.fillRect(-130, -h / 2 + 780, 260, 60); ctx.font = "bold 44px monospace"; ctx.fillStyle = "#39FF14"; ctx.fillText("000127", 0, -h / 2 + 825);
  ctx.font = "26px 'Times New Roman', serif"; ctx.fillStyle = "#555"; ctx.fillText("© 2009 · Last updated: 03/14/2011", 0, h / 2 - 40);
  ctx.restore();
}
SEG[4] = { dur: 6.6, draw(t) {
  bgGrad("#14243A", C.deep); glow(W / 2, H * 0.42, 900, "rgba(44,80,121,A)", 0.6); vignette(0.45);
  const bgo = 1 - E.io(prog(t, 0.05, 0.35));
  if (bgo > 0 && IMG.bg) { ctx.save(); ctx.globalAlpha = bgo; cover(IMG.bg, 1 + 0.25 * (1 - bgo), 0.5, 0.45, (1 - bgo) * 16); ctx.restore(); }
  const SLAP = 2.05;
  // old site: flies in from the lens, then gets slapped off to the left
  const ip = E.expo(prog(t, 0.08, 0.6)), sp = E.inExpo(prog(t, SLAP, 0.22));
  if (ip > 0 && sp < 1) {
    const shake = t > SLAP - 0.5 && t < SLAP ? Math.sin(t * 70) * 4 : 0;
    ctx.save(); ctx.globalAlpha = clamp(ip * 3); ctx.translate(W / 2 + shake - sp * 1500, H * 0.5 + sp * 120); ctx.rotate(lerp(0.12, -0.03, ip) - sp * 0.7); const s = lerp(2.6, 1, ip); ctx.scale(s, s);
    oldSite(900, 1000); ctx.restore();
    // what is wrong with it
    [["Not on Google", 0.85, -0.3, 0.27, C.red], ["Broken on phones", 1.1, 0.28, 0.62, C.red], ["Looks untrustworthy", 1.35, -0.22, 0.76, C.red]].forEach(([s, t0, dx, yy, col], i) => {
      const p = E.back(prog(t, t0, 0.5)); if (p <= 0) return;
      ctx.save(); ctx.translate(W / 2 + dx * W - sp * 1700, H * yy + sp * 200); ctx.rotate((i % 2 ? 0.05 : -0.05) - sp * 0.9); ctx.scale(p, p); pill(s, 0, 0, 50, col, "#fff"); ctx.restore();
    });
  }
  line(t, "Your website right now:", W / 2, H * 0.13, 74, 900, "#fff", 0.25, { out: 1.25 });
  line(t, "Do what the cat did.", W / 2, H * 0.13, 82, 900, C.peach, 1.72, { out: 2.1 });
  // the slap: white hit frame + speed streaks
  const fl = prog(t, SLAP + 0.04, 0.16);
  if (fl > 0 && fl < 1) { ctx.fillStyle = `rgba(255,255,255,${0.75 * (1 - fl)})`; ctx.fillRect(0, 0, W, H); }
  const sk = prog(t, SLAP, 0.35);
  if (sk > 0 && sk < 1) { const r = rng(7); ctx.fillStyle = `rgba(255,255,255,${0.5 * (1 - sk)})`; for (let i = 0; i < 26; i++) { const y = r() * H, l = 300 + r() * 700; ctx.fillRect(W - (sk * 2.2 + r() * 0.4) * W, y, l, 4 + r() * 6); } }
  // new site: phone slides in from the right
  const np = E.expo(prog(t, SLAP + 0.18, 0.7)), out = E.inExpo(prog(t, 3.85, 0.45));
  if (np > 0 && out < 1) {
    const pw = 600, ph = 1180;
    ctx.save(); ctx.translate(lerp(W + pw, W / 2, np), H * 0.54 - out * 1300); ctx.rotate(lerp(0.25, 0, np));
    shadow(90, 40, 0.55); ctx.fillStyle = "#0C0F14"; rr(-pw / 2 - 18, -ph / 2 - 18, pw + 36, ph + 36, 86); ctx.fill(); noShadow();
    ctx.save(); rr(-pw / 2, -ph / 2, pw, ph, 70); ctx.clip(); ctx.fillStyle = "#fff"; ctx.fillRect(-pw / 2, -ph / 2, pw, ph);
    if (IMG.site) { const s = pw / IMG.site.width; ctx.drawImage(IMG.site, -pw / 2, -ph / 2 - E.io(prog(t, 2.7, 1.4)) * 360, pw, IMG.site.height * s); }
    ctx.restore(); ctx.fillStyle = "#0C0F14"; rr(-80, -ph / 2 + 16, 160, 40, 20); ctx.fill();
    ctx.restore();
    [["€100 · first 10 clients", 2.55, -0.17, 0.33, C.warm2], ["Live in 5 days", 2.8, 0.2, 0.55, C.navy2], ["Works on phones", 3.05, -0.18, 0.75, C.green]].forEach(([s, t0, dx, yy, col], i) => {
      const p = E.back(prog(t, t0, 0.5)); if (p <= 0) return;
      ctx.save(); ctx.globalAlpha = 1 - out; ctx.translate(W / 2 + dx * W, H * yy - out * 300); ctx.rotate(i % 2 ? 0.04 : -0.04); ctx.scale(p, p); pill(s, 0, 0, 52, col, "#fff"); ctx.restore();
    });
  }
  line(t, "New website. €100.", W / 2, H * 0.13, 84, 900, "#fff", SLAP + 0.5, { out: 3.8 });
  ctaCard(t, 4.3, "WEBSITE", "Comment", true);
} };
// 06 · keycaps flatten into a 2D chat: DM sent, reply arrives
SEG[6] = { dur: 5.2, draw(t) {
  cover(IMG.bg, 1 + 0.04 * t);
  const fl = E.io(prog(t, 0.0, 0.5));
  ctx.save(); ctx.globalAlpha = fl; bgGrad("#1A1410", "#0E0C0A"); glow(W / 2, H * 0.4, 800, "rgba(224,122,79,A)", 0.3); ctx.restore();
  // chat panel
  const cp = E.expo(prog(t, 0.6, 0.7));
  if (cp > 0) {
    ctx.save(); ctx.globalAlpha = cp; ctx.translate(0, (1 - cp) * 80);
    shadow(60, 20, 0.4); ctx.fillStyle = "#F4F5F7"; rr(70, H * 0.17, W - 140, H * 0.68, 50); ctx.fill(); noShadow();
    ctx.fillStyle = "#fff"; rr(70, H * 0.17, W - 140, 170, 50); ctx.fill(); ctx.fillRect(70, H * 0.17 + 120, W - 140, 50);
    ctx.fillStyle = C.navy; ctx.beginPath(); ctx.arc(170, H * 0.17 + 85, 50, 0, 7); ctx.fill(); if (IMG.markw) ctx.drawImage(IMG.markw, 145, H * 0.17 + 55, 50, 60);
    txt("beribus", 245, H * 0.17 + 78, 800, 46, C.ink, "left", 0); txt("Active now", 245, H * 0.17 + 122, 600, 32, C.green, "left", 0);
    ctx.fillStyle = "#fff"; rr(110, H * 0.78 - 60, W - 220, 120, 60); ctx.fill();
    ctx.restore();
  // flat keycaps, sliding into the message field
  const word = "WEBSITE", into = E.io(prog(t, 0.9, 0.6)), gone = prog(t, 1.5, 0.15);
  if (gone < 1) { ctx.save(); ctx.globalAlpha = 1 - gone;
  for (let i = 0; i < 7; i++) {
    const p = E.back(prog(t, 0.15 + i * 0.05, 0.5)); if (p <= 0) continue;
    const x0 = W / 2 + (i - 3) * 132, y0 = H * 0.42;
    const x1 = 190 + i * 40, y1 = H * 0.78;
    const x = lerp(x0, x1, into), y = lerp(y0, y1, into), s = lerp(1, 0.4, into) * (0.6 + 0.4 * p);
    ctx.save(); ctx.translate(x, y); ctx.scale(s, s); shadow(20, 10, 0.4); ctx.fillStyle = C.warm2; rr(-56, -56, 112, 112, 22); ctx.fill(); noShadow();
    ctx.fillStyle = "rgba(255,255,255,0.18)"; rr(-56, -56, 112, 40, 22); ctx.fill(); txt(word[i], 0, 22, 800, 64, "#fff"); ctx.restore();
  }
  ctx.restore(); }
  if (t > 1.5 && t < 1.75) txt("WEBSITE", 165, H * 0.78 + 18, 700, 50, C.ink, "left", 0.02);
    // sent bubble
    const sp = E.back(prog(t, 1.6, 0.5));
    if (sp > 0) { ctx.save(); ctx.translate(W - 140, H * 0.36); ctx.scale(sp, sp); const w = measure("WEBSITE", 700, 60) + 90; ctx.fillStyle = C.navy; rr(-w, -60, w, 120, 50); ctx.fill(); txt("WEBSITE", -w / 2, 22, 700, 60, "#fff", "center", 0.02); ctx.restore(); txt("Sent", W - 150, H * 0.36 + 100, 600, 30, C.soft, "right", 0); }
    // typing dots then reply
    if (t > 2.2 && t < 2.9) { ctx.fillStyle = "#fff"; rr(140, H * 0.45, 200, 110, 50); ctx.fill(); for (let i = 0; i < 3; i++) { ctx.fillStyle = `rgba(90,98,114,${0.4 + 0.6 * (0.5 + 0.5 * Math.sin(t * 9 - i))})`; ctx.beginPath(); ctx.arc(195 + i * 45, H * 0.45 + 55, 13, 0, 7); ctx.fill(); } }
    const rp = E.back(prog(t, 2.9, 0.5));
    if (rp > 0) { ctx.save(); ctx.translate(140, H * 0.45); ctx.scale(rp, rp); ctx.fillStyle = "#fff"; rr(0, 0, 740, 250, 50); ctx.fill(); txt("Let's build it! 🙂".replace(" 🙂", ""), 45, 85, 700, 52, C.ink, "left", 0); txt("€100 · live in 5 days", 45, 160, 600, 44, C.warm, "left", 0); txt("First 10 clients only", 45, 215, 500, 36, C.soft, "left", 0); ctx.restore(); }
    if (t > 3.8) { line(t, "DM us “WEBSITE”", W / 2, H * 0.93, 70, 900, "#fff", 3.9); }
  }
} };
// 07 · all 2D: coins pour over the meme, a price tag swings in
SEG[7] = { dur: 7.0, draw(t) {
  const bgp = E.io(prog(t, 0.9, 0.6));
  if (IMG.bg) cover(IMG.bg, 1 + 0.05 * t, 0.5, 0.5, bgp * 12);
  ctx.save(); ctx.globalAlpha = bgp; bgGrad("#0E1B2D", "#060B14"); glow(W / 2, H * 0.3, 900, "rgba(232,176,74,A)", 0.3); ctx.restore();
  const r = rng(9);
  const coins = [];
  for (let i = 0; i < 120; i++) coins.push({ x: r() * W, d: r() * 1.6, s: 44 + r() * 30, sp: 0.7 + r() * 0.6, rot: r() * 6, w: (r() - 0.5) * 8, land: H * (0.86 + r() * 0.1) - (i % 30) * 6 });
  for (const c of coins) {
    const tt = t - c.d; if (tt <= 0) continue;
    let y = -100 + 1600 * tt * tt * c.sp; const landed = y >= c.land; if (landed) y = c.land;
    const ang = landed ? c.rot : c.rot + c.w * tt, sq = landed ? 0.35 : Math.abs(Math.cos(ang));
    ctx.save(); ctx.translate(c.x, y); ctx.scale(1, 1);
    const g = ctx.createLinearGradient(-c.s, -c.s, c.s, c.s); g.addColorStop(0, "#FFE08A"); g.addColorStop(0.5, C.gold); g.addColorStop(1, "#A8761E");
    ctx.fillStyle = "#8E621A"; ctx.beginPath(); ctx.ellipse(0, 6, c.s, c.s * Math.max(0.08, sq), 0, 0, 7); ctx.fill();
    ctx.fillStyle = g; ctx.beginPath(); ctx.ellipse(0, 0, c.s, c.s * Math.max(0.08, sq), 0, 0, 7); ctx.fill();
    ctx.strokeStyle = "rgba(255,240,190,0.7)"; ctx.lineWidth = 3; ctx.beginPath(); ctx.ellipse(0, 0, c.s * 0.72, c.s * 0.72 * Math.max(0.08, sq), 0, 0, 7); ctx.stroke();
    ctx.restore();
  }
  // price tag on a string
  const tp = prog(t, 2.4, 0.9);
  if (tp > 0) {
    const tau = t - 2.4, sw = 0.5 * Math.exp(-tau * 2.2) * Math.cos(tau * 5.5);
    const y0 = lerp(-700, 0, E.expo(tp));
    ctx.save(); ctx.translate(W / 2, H * 0.12 + y0); ctx.rotate(sw);
    ctx.strokeStyle = "#C9CED8"; ctx.lineWidth = 6; ctx.beginPath(); ctx.moveTo(0, -300); ctx.lineTo(0, 120); ctx.stroke();
    shadow(60, 30, 0.45); ctx.fillStyle = C.cream; rr(-330, 120, 660, 400, 50); ctx.fill(); noShadow();
    ctx.fillStyle = "#0E1B2D"; ctx.beginPath(); ctx.arc(0, 175, 22, 0, 7); ctx.fill();
    txt("THE WHOLE PRICE", 0, 270, 700, 40, C.navy, "center", 0.12); txt("€100", 0, 460, 900, 200, C.warm);
    ctx.restore();
  }
  line(t, "No monthly fees.", W / 2, H * 0.43, 76, 900, "#fff", 3.6);
  line(t, "Website in 5 days.", W / 2, H * 0.43 + 96, 76, 900, C.peach, 3.8);
  if (t > 4.6) { const p = E.back(prog(t, 4.7, 0.6)); ctx.save(); ctx.translate(W / 2, H * 0.6); ctx.scale(0.7 + 0.3 * p, 0.7 + 0.3 * p); ctx.globalAlpha = clamp(p * 2); pill("DM “WEBSITE”", 0, 0, 80, C.warm2, "#fff"); ctx.restore(); }
  logoRow(t, 5.0, H * 0.69);
} };
// 08 · the 3D frame splits in two -> comparison table
SEG[8] = { dur: 6.0, draw(t) {
  bgGrad("#FFF8F2", "#F2E2D4");
  const sp = E.quint(prog(t, 0.05, 0.7));
  if (sp < 1 && IMG.bg) { for (const side of [-1, 1]) { ctx.save(); ctx.beginPath(); ctx.rect(side < 0 ? 0 : W / 2, 0, W / 2, H); ctx.clip(); ctx.translate(side * sp * W * 0.6, 0); cover(IMG.bg); ctx.restore(); } }
  const tp = E.expo(prog(t, 0.45, 0.7));
  if (tp > 0) {
    ctx.save(); ctx.globalAlpha = tp; ctx.translate(0, (1 - tp) * 60);
    txt("Facebook", W * 0.55, H * 0.2, 800, 46, "#8E8A86"); txt("page", W * 0.55, H * 0.2 + 52, 800, 46, "#8E8A86"); txt("Website", W * 0.81, H * 0.2 + 26, 900, 56, C.navy);
    ctx.fillStyle = "rgba(22,48,79,0.06)"; rr(W * 0.68, H * 0.16, W * 0.26, H * 0.57, 40); ctx.fill();

    rows.forEach((s, i) => {

      ctx.save(); ctx.globalAlpha = E.expo(p); ctx.translate((1 - E.expo(p)) * -40, 0);
      txt(s, W * 0.05, y + 15, 700, 42, C.ink, "left", -0.01);
      ctx.restore();
      cross(W * 0.55, y, 40, prog(t, 1.05 + i * 0.3, 0.3), "#B9B4AE");
      check(W * 0.81, y, 44, prog(t, 1.15 + i * 0.3, 0.35));
      ctx.fillStyle = "rgba(16,21,31,0.08)"; ctx.fillRect(W * 0.06, y + 75, W * 0.88 * E.expo(p), 3);

  ctaCard(t, 3.9, "WEBSITE", "Comment", true);

// 09 · 2D question grows until it fills the screen (then the 3D scene opens from it)
SEG[9] = { dur: 2.7, draw(t) {

// ---------- frame with motion blur ----------
let SEGID = 2;
function frame(time, n = 6, shutter = 0.5) {
  const seg = SEG[SEGID];
  out.globalAlpha = 1; out.fillStyle = "#000"; out.fillRect(0, 0, W, H);
  for (let k = 0; k < n; k++) {
    const tt = time + (k / n - 0.5) * shutter / 24;
    ctx.save(); ctx.clearRect(0, 0, W, H); seg.draw(Math.max(0, tt)); ctx.restore();
    out.globalAlpha = 1 / (k + 1); out.drawImage(sub, 0, 0);
  }
  out.globalAlpha = 1; ctx = out; grain(time, 0.035); ctx = sub.getContext("2d");
}
window.mg = { SEG, frame, load, set(id) { SEGID = id; }, canvas: cv };
